[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./" }, { access = "read", path = "../.env" }]

[lint]
# Silence stylistic, gas, code-size, and false-positive lints. The setters below
# do emit events (the access-control lint misfires), and the excluded rules are
# readability or micro-optimization suggestions we intentionally decline.
exclude_lints = [
    "asm-keccak256",
    "screaming-snake-case-immutable",
    "unwrapped-modifier-logic",
    "modifier-used-only-once",
    "missing-events-access-control",
    "block-timestamp",
    "calls-loop",
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
