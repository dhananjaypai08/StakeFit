# StakeFit CRE secrets (example).
#
# Register these with the Vault DON so they are released only inside the attested
# enclave. Never commit real values.

secrets:
  # The reasoning model key used for the two in-enclave audits.
  OPENROUTER_API_KEY: "sk-or-..."
  # The confidential severity rubric. Keep the scoring policy secret so it cannot
  # be gamed. A JSON string is fine.
  STAKEFIT_RUBRIC: '[{"category":"Sensitive data exposure","weight":1.0,"denyThreshold":8}]'
